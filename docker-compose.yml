services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: config_monitor
      POSTGRES_USER: config_monitor
      POSTGRES_PASSWORD: config_monitor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U config_monitor -d config_monitor"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mock-webhook:
    build: .
    command: ["python", "-m", "app.mock_webhook"]
    ports:
      - "9001:9001"
    # mock_webhook listens on loopback by default; override with MOCK_WEBHOOK_HOST=0.0.0.0
    environment:
      MOCK_WEBHOOK_HOST: 0.0.0.0

  api:
    build: .
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://config_monitor:config_monitor@db:5432/config_monitor
      CONFIG_ROOT: /app/config_samples
      WEBHOOK_URL: http://mock-webhook:9001/webhook
    volumes:
      - ./config_samples:/app/config_samples
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  watcher:
    build: .
    command: ["python", "-m", "app.cli", "watcher"]
    environment:
      DATABASE_URL: postgresql+psycopg://config_monitor:config_monitor@db:5432/config_monitor
      CONFIG_ROOT: /app/config_samples
      WEBHOOK_URL: http://mock-webhook:9001/webhook
    volumes:
      - ./config_samples:/app/config_samples
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.cli", "worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://config_monitor:config_monitor@db:5432/config_monitor
      CONFIG_ROOT: /app/config_samples
      WEBHOOK_URL: http://mock-webhook:9001/webhook
    depends_on:
      db:
        condition: service_healthy
      mock-webhook:
        condition: service_started

volumes:
  postgres_data:
